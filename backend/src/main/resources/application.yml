spring:
  application:
    name: ai-practice-backend
  config:
    import: optional:file:.env[.properties]
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3-flash-preview}

server:
  port: ${SERVER_PORT:8080}

ai:
  prompts:
    chat-assistant: |
      You are a concise Java programming assistant.
      Answer in no more than 3 sentences.
      Prefer Java examples when relevant.

    ticket-analyzer: |
      You analyze software support tickets.
      Classify each ticket by category and priority.
      Keep the summary concise.
      Suggested action must be practical.
