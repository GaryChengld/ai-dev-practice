spring:
  application:
    name: ai-practice-backend
  config:
    import: optional:file:.env[.properties]
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        embedding:
          api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3-flash-preview}

server:
  port: ${SERVER_PORT:8080}

ai:
  context:
    query-rewrite-max-input-tokens: 2000
  prompts:
    chat-assistant: chat-assistant.md
    ticket-analyzer: ticket-analyzer.md
    knowledge-category-router: knowledge-category-router.md
    knowledge-query-rewriter: knowledge-query-rewriter.md
    conversation-summarizer: conversation-summarizer.md
    chat-summary: chat-summary.md
